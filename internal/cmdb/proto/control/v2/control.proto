syntax = "proto3";

package nexus.control.v2;

option go_package = "github.com/ongridio/ongrid/internal/cmdb/proto/control/v2;controlv2";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ControlPlane is the mTLS channel between a collector (euler) and the
// control-plane relay (riemann). The relay is stateless: it forwards task
// snapshots and reports to CMDB, and never caches or interprets task payloads.
service ControlPlane {
  // Enroll exchanges a one-time enrollment token for a client certificate.
  // It is the only RPC accepted without a client certificate.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // TaskChannel is bidirectional: euler sends its known revisions, ACKs and
  // heartbeats; riemann sends snapshots, commands and errors.
  rpc TaskChannel(stream EulerMessage) returns (stream RiemannMessage);

  // ReportBatch uploads collected instances. CMDB deduplicates by report_id.
  rpc ReportBatch(ReportBatchRequest) returns (ReportBatchResponse);

  // ReportExecLogs uploads execution logs. Lower priority than reports.
  rpc ReportExecLogs(ExecLogBatchRequest) returns (ExecLogBatchResponse);

  // Heartbeat reports liveness, capabilities and spool depth.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // RenewCert renews the client certificate over an existing mTLS connection.
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);

  // GetRevocations returns euler IDs revoked by CMDB since a cursor.
  rpc GetRevocations(GetRevocationsRequest) returns (GetRevocationsResponse);
}

message Capabilities {
  repeated string roles = 1;
  repeated string collect_keys = 2;
  repeated string cloud_providers = 3;
  repeated string snmp_profiles = 4;
  repeated string build_tags = 5;
  string version = 6;
}

message EnrollRequest {
  string token = 1;
  string euler_id = 2;
  string hostname = 3;
  string ip_address = 4;
  string os_type = 5;
  string agent_version = 6;
  bytes public_key = 7;
  bytes csr = 8;
  Capabilities capabilities = 9;
}

message EnrollResponse {
  bytes cert_chain = 1;
  bytes ca_chain = 2;
  google.protobuf.Timestamp cert_expires_at = 3;
  bytes task_signing_public_key = 4;
  string task_signing_key_id = 5;
  string api_version = 6;
  int32 max_batch_items = 7;
  int32 max_message_bytes = 8;
  int64 server_time_unix = 9;
}

message EulerMessage {
  oneof body {
    TaskSyncRequest sync = 1;
    TaskAck ack = 2;
    HeartbeatRequest heartbeat = 3;
  }
}

message RiemannMessage {
  oneof body {
    TaskSnapshot snapshot = 1;
    Command command = 2;
    ServerError error = 3;
  }
}

message TaskSyncRequest {
  string euler_id = 1;
  bool state_lost = 2;
  repeated TaskRevision known = 3;
  Capabilities capabilities = 4;
  int64 spool_depth = 5;
  string last_error = 6;
}

message TaskRevision {
  string task_id = 1;
  string revision = 2;
  // True when euler has the task spec but no usable secret envelope.
  bool need_secret = 3;
}

message TaskSnapshot {
  string euler_id = 1;
  string snapshot_epoch = 2;
  // When true, euler discards its local task set before applying this snapshot.
  bool reset = 3;
  repeated Task changed = 4;
  repeated string removed_task_ids = 5;
  // Configuration problems the relay should surface to an operator. Warnings
  // do not prevent the other tasks in the snapshot from running.
  repeated string warnings = 6;
}

message Task {
  string task_id = 1; // "t:<target_id>" or "s:<scan_rule_id>"
  string kind = 2;    // host | components | plugin | cloud | snmp | ipam_scan
  string revision = 3;
  int32 type_id = 4;
  int32 adr_id = 5;
  string collect_key = 6;
  string unique_key = 7;
  map<string, string> mapping = 8;
  google.protobuf.Struct params = 9;
  Schedule schedule = 10;
  bytes secret_envelope = 11;
  string secret_key_id = 12;
  string secret_alg = 13;
  Artifact artifact = 14;
  repeated string capabilities_required = 15;
  bool enabled = 16;
  google.protobuf.Timestamp expires_at = 17;
  string trace_id = 18;
  bytes signature = 19;
  string signing_key_id = 20;
}

message Schedule {
  string cron = 1;
  string timezone = 2;
  int32 jitter_seconds = 3;
  int32 timeout_seconds = 4;
  int32 max_concurrency = 5;
  bool run_on_start = 6;
}

message Artifact {
  string language = 1; // python
  string sha256 = 2;
  bytes script = 3;
  bytes signature = 4;
  string signing_key_id = 5;
}

message TaskAck {
  string task_id = 1;
  string revision = 2;
  string state = 3; // applied | rejected | failed
  string error = 4;
}

message HeartbeatRequest {
  string euler_id = 1;
  Capabilities capabilities = 2;
  int64 spool_depth = 3;
  string last_error = 4;
}

message HeartbeatResponse {
  bool ok = 1;
  int64 server_time_unix = 2;
}

message ReportBatchRequest {
  string euler_id = 1;
  repeated Report reports = 2;
}

message Report {
  string report_id = 1;
  string task_id = 2;
  string unique_value = 3;
  bytes instance_json = 4;
  bool deleted = 5;
  google.protobuf.Timestamp observed_at = 6;
  string trace_id = 7;
}

message ReportBatchResponse {
  repeated ReportResult results = 1;
}

message ReportResult {
  string report_id = 1;
  string status = 2; // created | changed | rejected | stale | duplicate
  string error = 3;
  int32 ci_id = 4;
}

message ExecLogBatchRequest {
  string euler_id = 1;
  repeated ExecLog logs = 2;
}

message ExecLog {
  string log_id = 1;
  string task_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  bool success = 5;
  string stdout = 6;
  string stderr = 7;
  string trace_id = 8;
}

message ExecLogBatchResponse {
  repeated ExecLogResult results = 1;
}

message ExecLogResult {
  string log_id = 1;
  bool accepted = 2;
  string error = 3;
}

message Command {
  string kind = 1; // run_now | reload | drain
  string task_id = 2;
  string reason = 3;
}

message ServerError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message RenewCertRequest {
  string euler_id = 1;
  bytes csr = 2;
}

message RenewCertResponse {
  bytes cert_chain = 1;
  bytes ca_chain = 2;
  google.protobuf.Timestamp cert_expires_at = 3;
}

message GetRevocationsRequest {
  int64 since_unix = 1;
}

message GetRevocationsResponse {
  repeated string revoked_euler_ids = 1;
  int64 next_since_unix = 2;
}
