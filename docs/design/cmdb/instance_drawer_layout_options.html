<meta charset="utf-8">
<title>实例抽屉布局方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*
 * Layout: workbar -> [brief | console stage]. The stage is a mock of the CMDB
 * page with the instance drawer open on the right; switching a tab swaps only
 * the drawer's internal layout.
 * Palette: taken from web/src/styles/index.css (zinc-purple neutrals, indigo
 * primary), so the options read as the product rather than a separate mock.
 * Type: Inter for UI, ui-monospace for IDs.
 */
:root {
  --font-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --bg: 244 245 248;
  --card: 255 255 255;
  --field: 255 255 255;
  --border: 209 213 219;
  --border-soft: 226 232 240;
  --text: 17 24 39;
  --text-muted: 71 85 105;
  --text-faint: 100 116 139;
  --accent: 109 87 217;
  --primary: 79 70 229;
  --primary-hover: 99 102 241;
  --ok: 4 120 87;
  --warn: 180 83 9;
  --danger: 185 28 28;
  --info: 14 116 144;
  --scrim: 15 23 42;
  --shadow: 0 18px 45px rgb(15 23 42 / .12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 11 11 17;
    --card: 23 23 32;
    --field: 16 16 24;
    --border: 40 40 50;
    --border-soft: 40 40 50;
    --text: 244 244 245;
    --text-muted: 161 161 170;
    --text-faint: 113 113 122;
    --accent: 140 109 240;
    --primary: 79 70 229;
    --primary-hover: 99 102 241;
    --ok: 16 185 129;
    --warn: 245 158 11;
    --danger: 239 68 68;
    --info: 48 166 208;
    --scrim: 0 0 0;
    --shadow: 0 18px 50px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: 11 11 17;
  --card: 23 23 32;
  --field: 16 16 24;
  --border: 40 40 50;
  --border-soft: 40 40 50;
  --text: 244 244 245;
  --text-muted: 161 161 170;
  --text-faint: 113 113 122;
  --accent: 140 109 240;
  --primary: 79 70 229;
  --primary-hover: 99 102 241;
  --ok: 16 185 129;
  --warn: 245 158 11;
  --danger: 239 68 68;
  --info: 48 166 208;
  --scrim: 0 0 0;
  --shadow: 0 18px 50px rgb(0 0 0 / .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: rgb(var(--bg)); }
body {
  margin: 0;
  background: rgb(var(--bg));
  color: rgb(var(--text));
  font: 12px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: rgb(var(--card));
}
h1, h2, h3, p, dl, dd { margin: 0; }
button { font-family: inherit; }
.ic {
  width: 14px; height: 14px; flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
:focus-visible { outline: 2px solid rgb(var(--primary)); outline-offset: 2px; }

/* ---------- top workbar ---------- */
.workbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: rgb(var(--card) / .94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgb(var(--border));
}
.workbar-in {
  max-width: 1480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; flex: none;
  border-radius: 8px;
  border: 1px solid rgb(var(--accent) / .25);
  background: rgb(var(--accent) / .12);
  color: rgb(var(--accent));
  display: grid; place-items: center;
}
.brand h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
.brand p { font-size: 11px; color: rgb(var(--text-faint)); margin-top: 1px; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.tool-btn {
  height: 30px; padding: 0 9px;
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--card));
  color: rgb(var(--text-muted));
  font-size: 11px; font-weight: 500;
  cursor: pointer;
}
.tool-btn:hover { background: rgb(var(--text) / .05); color: rgb(var(--text)); }

.tabs-in {
  max-width: 1480px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
  overflow-x: auto;
  padding-bottom: 9px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  scrollbar-width: none;
}
.tabs-in::-webkit-scrollbar { display: none; }
.tabs {
  display: flex; gap: 2px;
  padding: 3px;
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  background: rgb(var(--text) / .03);
  flex: none;
}
.tab {
  height: 30px; padding: 0 12px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: rgb(var(--text-muted));
  font-size: 12px; white-space: nowrap;
  cursor: pointer;
}
.tab:hover { color: rgb(var(--text)); }
.tab[aria-selected="true"] {
  background: rgb(var(--card));
  color: rgb(var(--text));
  font-weight: 500;
  box-shadow: 0 1px 2px rgb(0 0 0 / .14);
}

/* ---------- workspace ---------- */
.workspace {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
  padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brief {
  position: sticky;
  top: 128px;
  align-self: start;
  border: 1px solid rgb(var(--border));
  border-radius: 10px;
  background: rgb(var(--card));
  padding: 14px;
}
.pick-row { display: flex; align-items: center; gap: 8px; }
.pick-badge {
  display: inline-flex; align-items: center;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid rgb(var(--accent) / .3);
  background: rgb(var(--accent) / .1);
  color: rgb(var(--accent));
  font-size: 10px; font-weight: 600;
  white-space: nowrap;
}
.brief h2 { font-size: 14px; font-weight: 600; }
.tagline { font-size: 11px; color: rgb(var(--text-faint)); margin-top: 4px; }
.facts { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.facts dt { font-size: 10px; color: rgb(var(--text-faint)); letter-spacing: .03em; margin-bottom: 2px; }
.facts dd { font-size: 12px; color: rgb(var(--text-muted)); line-height: 1.55; }
.brief-note { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgb(var(--border)); }
.brief-note h3 { font-size: 11px; font-weight: 600; margin-bottom: 6px; }
.brief-note ul { margin: 0; padding-left: 14px; font-size: 11px; line-height: 1.75; color: rgb(var(--text-faint)); }
.reco {
  margin-top: 12px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgb(var(--border));
  background: rgb(var(--text) / .025);
  font-size: 11px;
  color: rgb(var(--text-muted));
  line-height: 1.55;
}
.reco strong { color: rgb(var(--text)); font-weight: 600; }

.stage { min-width: 0; }
.app-mock {
  position: relative;
  display: flex;
  height: clamp(600px, 74vh, 820px);
  border: 1px solid rgb(var(--border));
  border-radius: 12px;
  overflow: hidden;
  background: rgb(var(--bg));
  box-shadow: var(--shadow);
}
.app-rail {
  width: 52px; flex: none;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 0;
  background: rgb(var(--card));
  border-right: 1px solid rgb(var(--border));
}
.rail-btn {
  width: 32px; height: 32px;
  border: 0; border-radius: 7px;
  background: transparent;
  color: rgb(var(--text-faint));
  display: grid; place-items: center;
  cursor: pointer;
}
.rail-btn:hover { background: rgb(var(--text) / .05); color: rgb(var(--text)); }
.rail-btn[aria-current="true"] { background: rgb(var(--text) / .07); color: rgb(var(--text)); }
.app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 16px 16px 12px;
}
.page-title h2 { font-size: 14px; font-weight: 600; }
.page-title p { font-size: 11px; color: rgb(var(--text-faint)); margin-top: 2px; }
.page-tools { display: flex; align-items: center; gap: 8px; }
.search-box { position: relative; }
.search-box input {
  width: 200px; height: 34px;
  padding: 0 10px 0 30px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--field));
  color: rgb(var(--text));
  font: 12px var(--font-ui);
}
.search-box .ic {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; color: rgb(var(--text-faint)); pointer-events: none;
}
.table-card {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  margin: 0 16px 16px;
  border: 1px solid rgb(var(--border));
  border-radius: 10px;
  background: rgb(var(--card));
  overflow: hidden;
}
.table-scroll { flex: 1; min-height: 0; overflow: auto; }
table { width: 100%; min-width: 700px; border-collapse: collapse; }
th {
  position: sticky; top: 0; z-index: 1;
  padding: 8px 12px;
  background: rgb(var(--card));
  border-bottom: 1px solid rgb(var(--border));
  color: rgb(var(--text-faint));
  font-size: 11px; font-weight: 500; text-align: left;
  white-space: nowrap;
}
td { padding: 9px 12px; border-bottom: 1px solid rgb(var(--border) / .7); color: rgb(var(--text-muted)); }
td.name { color: rgb(var(--text)); font-weight: 500; }
tbody tr:hover td { background: rgb(var(--text) / .03); }
tr[data-selected] td { background: rgb(99 102 241 / .09); }
tr[data-selected]:hover td { background: rgb(99 102 241 / .13); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; white-space: nowrap; }
.status i { width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--text-faint)); }
.status[data-tone="ok"] i { background: rgb(var(--ok)); }
.status[data-tone="warn"] { color: rgb(var(--warn)); }
.status[data-tone="warn"] i { background: rgb(var(--warn)); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }
.row-btn {
  width: 24px; height: 24px;
  border: 0; border-radius: 5px;
  background: transparent; color: rgb(var(--text-faint));
  display: grid; place-items: center; cursor: pointer;
}
.row-btn:hover { background: rgb(var(--text) / .06); color: rgb(var(--text)); }

/* ---------- overlay + drawer shell ---------- */
.scrim {
  position: absolute; inset: 0; z-index: 2;
  background: rgb(var(--scrim) / .35);
  transition: opacity .2s ease;
}
.app-mock[data-open="false"] .scrim { opacity: 0; pointer-events: none; }
.drawer {
  position: absolute; inset: 0 0 0 auto; z-index: 3;
  width: min(44rem, 100%);
  display: flex; flex-direction: column;
  background: rgb(var(--card));
  border-left: 1px solid rgb(var(--border));
  box-shadow: -24px 0 60px rgb(0 0 0 / .18);
  transition: transform .24s ease;
  container-type: inline-size;
}
.app-mock[data-open="false"] .drawer { transform: translateX(100%); }
.drawer.v-b { width: min(60rem, 100%); }
.closed-hint {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 1;
  display: none;
  padding: 6px 12px;
  border: 1px solid rgb(var(--border));
  border-radius: 999px;
  background: rgb(var(--card));
  color: rgb(var(--text-muted));
  font-size: 11px;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.app-mock[data-open="false"] .closed-hint { display: block; }

.dw-head {
  flex: none;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid rgb(var(--border));
}
.dw-head.plain { padding: 16px; }
.model-icon {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  background: rgb(var(--text) / .03);
  color: rgb(var(--text-muted));
}
.dw-titles { flex: 1; min-width: 0; }
.dw-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dw-title-row h2 {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dw-title { font-size: 14px; font-weight: 600; }
.dw-sub { font-size: 11px; color: rgb(var(--text-faint)); margin-top: 2px; }
.tag {
  flex: none;
  padding: 1px 6px;
  border: 1px solid rgb(var(--border));
  border-radius: 4px;
  background: rgb(var(--text) / .03);
  color: rgb(var(--text-muted));
  font-size: 10px; font-weight: 500;
  white-space: nowrap;
}
.tag-new {
  border-color: rgb(var(--info) / .3);
  background: rgb(var(--info) / .08);
  color: rgb(var(--info));
}
.icon-btn {
  width: 28px; height: 28px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 6px;
  background: transparent;
  color: rgb(var(--text-faint));
  cursor: pointer;
}
.icon-btn:hover { background: rgb(var(--text) / .06); color: rgb(var(--text)); }
.dw-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.dw-foot {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  border-top: 1px solid rgb(var(--border));
}
.foot-hint {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 6px;
  color: rgb(var(--text-faint));
  font-size: 11px;
}
.foot-hint .dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: rgb(var(--ok)); }

.btn {
  height: 34px; padding: 0 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 12px; font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.btn.primary { background: rgb(var(--primary)); border-color: rgb(var(--primary)); color: #fff; }
.btn.primary:hover { background: rgb(var(--primary-hover)); border-color: rgb(var(--primary-hover)); }
.btn.ghost { background: rgb(var(--card)); border-color: rgb(var(--border)); color: rgb(var(--text)); }
.btn.ghost:hover { background: rgb(var(--text) / .05); }

/* ---------- fields ---------- */
.field { min-width: 0; }
.field.span-2 { grid-column: 1 / -1; }
.flabel {
  display: block;
  margin-bottom: 4px;
  color: rgb(var(--text-muted));
  font-size: 12px;
  line-height: 1.4;
}
.star { color: rgb(var(--danger)); margin-left: 2px; }
.ctl {
  width: 100%; height: 36px;
  padding: 0 10px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--field));
  color: rgb(var(--text));
  font: 12px/1.4 var(--font-ui);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.ctl:hover { border-color: rgb(var(--text-faint)); }
.ctl:focus-visible { outline: none; border-color: rgb(var(--primary)); box-shadow: 0 0 0 3px rgb(99 102 241 / .15); }
.ctl-area { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; }
.ctl.mono, .mono { font-family: var(--font-mono); font-size: 11px; }
.ctl-wrap { position: relative; }
.ctl-wrap select { appearance: none; padding-right: 28px; cursor: pointer; }
.sel-chev {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  width: 12px; height: 12px;
  color: rgb(var(--text-faint));
  pointer-events: none;
}
.field-ic {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px;
  color: rgb(var(--text-faint));
  pointer-events: none;
}
.ctl-icon-right { padding-right: 30px; }
.fhint { margin-top: 4px; color: rgb(var(--text-faint)); font-size: 10px; line-height: 1.4; }
.star, .fhint { pointer-events: none; }

/* ---------- A: two-column cards ---------- */
.fcard {
  border: 1px solid rgb(var(--border));
  border-radius: 10px;
  background: rgb(var(--card));
  padding: 12px;
}
.a-form .fcard + .fcard { margin-top: 10px; }
.fcard-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.gicon {
  width: 22px; height: 22px; flex: none;
  display: grid; place-items: center;
  border-radius: 6px;
  background: rgb(var(--text) / .04);
  color: rgb(var(--text-muted));
}
.gicon .ic { width: 12px; height: 12px; }
.fcard-head h3 { font-size: 12px; font-weight: 600; }
.fcount { margin-left: auto; color: rgb(var(--text-faint)); font-size: 10px; white-space: nowrap; }
.reqcount {
  padding: 1px 5px;
  border: 1px solid rgb(var(--border));
  border-radius: 4px;
  color: rgb(var(--text-faint));
  font-size: 10px;
  white-space: nowrap;
}
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }

/* ---------- B: anchor rail ---------- */
.v-b .dw-body { display: flex; padding: 0; overflow: hidden; }
.b-rail {
  width: 184px; flex: none;
  display: flex; flex-direction: column; gap: 2px;
  padding: 12px 10px;
  border-right: 1px solid rgb(var(--border));
  background: rgb(var(--text) / .015);
  overflow-y: auto;
}
.rail-title {
  padding: 2px 6px 6px;
  color: rgb(var(--text-faint));
  font-size: 10px; font-weight: 500;
  letter-spacing: .06em;
}
.rail-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; height: 30px; padding: 0 8px;
  border: 0; border-radius: 6px;
  background: transparent;
  color: rgb(var(--text-muted));
  font-size: 12px; text-align: left;
  cursor: pointer;
}
.rail-item:hover { background: rgb(var(--text) / .05); }
.rail-item[aria-current="true"] {
  background: rgb(99 102 241 / .12);
  color: rgb(var(--text));
  font-weight: 500;
}
.rail-item span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item .n { margin-left: auto; color: rgb(var(--text-faint)); font-size: 10px; }
.rail-spacer { flex: 1; }
.rail-progress {
  margin-top: 10px;
  padding: 8px;
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  background: rgb(var(--card));
}
.rail-progress p { color: rgb(var(--text-faint)); font-size: 10px; }
.rail-progress strong { display: block; margin-top: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
.b-form { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 16px; }
.b-form .fcard + .fcard { margin-top: 10px; }

/* ---------- C: accordion + progress ---------- */
.progress-card {
  margin-bottom: 10px;
  padding: 10px 12px;
  border: 1px solid rgb(var(--border));
  border-radius: 10px;
  background: rgb(var(--text) / .02);
}
.progress-top {
  display: flex; align-items: baseline; justify-content: space-between;
  color: rgb(var(--text-muted));
  font-size: 11px;
}
.progress-top strong { color: rgb(var(--text)); font-size: 12px; font-variant-numeric: tabular-nums; }
.pbar { height: 4px; margin: 8px 0 6px; border-radius: 2px; background: rgb(var(--text) / .08); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 2px; background: rgb(var(--primary)); }
.progress-note { color: rgb(var(--text-faint)); font-size: 10px; }
.acc {
  margin-bottom: 8px;
  border: 1px solid rgb(var(--border));
  border-radius: 10px;
  background: rgb(var(--card));
  overflow: hidden;
}
.acc-head {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 9px 10px;
  border: 0; background: transparent;
  color: rgb(var(--text));
  font-size: 12px; text-align: left;
  cursor: pointer;
}
.acc-head:hover { background: rgb(var(--text) / .03); }
.acc-name { font-weight: 500; }
.acc-count { margin-left: auto; color: rgb(var(--text-faint)); font-size: 10px; font-variant-numeric: tabular-nums; }
.chev { color: rgb(var(--text-faint)); transition: transform .18s ease; }
.acc[data-open="false"] .chev { transform: rotate(-90deg); }
.acc-body { padding: 0 10px 10px; }
.acc[data-open="false"] .acc-body { display: none; }
.cstack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- D: compact single column ---------- */
.dsection + .dsection { margin-top: 16px; }
.dsection-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px; padding: 6px 0 7px;
  background: rgb(var(--card));
  border-bottom: 1px solid rgb(var(--border));
}
.dsection-head h3 { font-size: 12px; font-weight: 600; }

          '<span class="tag tag-new">' + L('新建', 'New') + '</span></div>' +
        '<p class="dw-sub">' + L('在「主机」下新建一条实例', 'A new instance of “Host”') + '</p>' +
      '</div>' +
      '<button class="icon-btn" type="button" data-close aria-label="' + L('关闭', 'Close') + '">' +
        '<svg class="ic"><use href="#i-x"/></svg></button>' +
    '</header>';
  }

  function footerHTML(withHint) {
    var s = stats();
    var hint = '';
    if (withHint) {
      var text = state.lang === 'en'
        ? s.filled + '/' + s.total + ' filled · ' + s.reqDone + '/' + s.reqTotal + ' required'
        : '已填 ' + s.filled + '/' + s.total + ' · 必填 ' + s.reqDone + '/' + s.reqTotal;
      hint = '<span class="foot-hint"><span class="dot"></span>' + esc(text) + '</span>';
    }
    return '<footer class="dw-foot">' + hint +
      '<button class="btn ghost" type="button">' + L('取消', 'Cancel') + '</button>' +
      '<button class="btn primary" type="button">' + L('保存', 'Save') + '</button>' +
    '</footer>';
  }

  /* ---------------- drawer variants ---------------- */

  function currentDrawer() {
    return '<header class="dw-head plain">' +
        '<div class="dw-titles"><div class="dw-title">' + L('新实例', 'New instance') + '</div>' +
        '<p class="dw-sub">' + L('在「主机」下新建一条实例', 'A new instance of “Host”') + '</p></div>' +
        '<button class="icon-btn" type="button" data-close aria-label="' + L('关闭', 'Close') + '">' +
          '<svg class="ic"><use href="#i-x"/></svg></button>' +
      '</header>' +
      '<div class="dw-body"><form class="cur-form">' +
        GROUPS.map(function (g) {
          return '<fieldset class="cur-section"><legend>' + esc(L(g.zh, g.en)) + '</legend>' +
            '<div class="cur-stack">' + g.fields.map(fieldHTML).join('') + '</div></fieldset>';
        }).join('') +
      '</form></div>' +
      footerHTML(false);
  }

  function cardHTML(g) {
    var req = g.fields.filter(function (f) { return f.required; }).length;
    return '<section class="fcard">' +
      '<header class="fcard-head">' + groupIcon(g) +
        '<h3>' + esc(L(g.zh, g.en)) + '</h3>' +
        '<span class="fcount">' + countText(g.fields.length) + '</span>' +
        (req ? '<span class="reqcount">' + L('必填', 'Required') + ' ' + req + '</span>' : '') +
      '</header>' +
      '<div class="fgrid">' + g.fields.map(fieldHTML).join('') + '</div>' +
    '</section>';
  }

  function twoColumnDrawer() {
    return headerHTML() +
      '<div class="dw-body"><form class="a-form">' + GROUPS.map(cardHTML).join('') + '</form></div>' +
      footerHTML(true);
  }

  function anchorDrawer() {
    var s = stats();
    var pct = Math.round((s.filled / s.total) * 100);
    return headerHTML() +
      '<div class="dw-body">' +
        '<nav class="b-rail" aria-label="' + L('分组', 'Sections') + '">' +
          '<p class="rail-title">' + L('分组', 'SECTIONS') + '</p>' +
          GROUPS.map(function (g, i) {
            return '<button class="rail-item" type="button" data-goto="' + g.key + '"' + (i === 0 ? ' aria-current="true"' : '') + '>' +
              '<svg class="ic"><use href="#i-' + g.icon + '"/></svg>' +
              '<span>' + esc(L(g.zh, g.en)) + '</span>' +
              '<span class="n">' + g.fields.length + '</span>' +
            '</button>';
          }).join('') +
          '<span class="rail-spacer"></span>' +
          '<div class="rail-progress">' +
            '<p>' + L('已填', 'Filled') + '</p>' +
            '<strong>' + s.filled + ' / ' + s.total + '</strong>' +
          '</div>' +
        '</nav>' +
        '<div class="b-form" id="bForm">' +
          GROUPS.map(function (g) {
            return '<section class="fcard" id="sec-' + g.key + '">' +
              '<header class="fcard-head">' + groupIcon(g) +
                '<h3>' + esc(L(g.zh, g.en)) + '</h3>' +
                '<span class="fcount">' + countText(g.fields.length) + '</span>' +
              '</header>' +
              '<div class="fgrid">' + g.fields.map(fieldHTML).join('') + '</div>' +
            '</section>';
          }).join('') +
        '</div>' +
      '</div>' +
      footerHTML(true);
  }

  function accordionDrawer() {
    var s = stats();
    var pct = Math.round((s.filled / s.total) * 100);
    return headerHTML() +
      '<div class="dw-body">' +
        '<div class="progress-card">' +
          '<div class="progress-top"><span>' + L('填写进度', 'Progress') + '</span>' +
            '<strong>' + s.filled + ' / ' + s.total + '</strong></div>' +
          '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
          '<p class="progress-note">' + L('必填 ' + s.reqDone + '/' + s.reqTotal + ' 已完成', s.reqDone + '/' + s.reqTotal + ' required complete') + '</p>' +
        '</div>' +
        GROUPS.map(function (g, i) {
          var open = i === 0;
          return '<section class="acc" data-open="' + open + '">' +
            '<button class="acc-head" type="button" data-acc aria-expanded="' + open + '">' +
              groupIcon(g) +
              '<span class="acc-name">' + esc(L(g.zh, g.en)) + '</span>' +
              '<span class="acc-count">' + filledIn(g) + '/' + g.fields.length + '</span>' +
              '<svg class="ic chev"><use href="#i-chevron"/></svg>' +
            '</button>' +
            '<div class="acc-body"><div class="cstack">' + g.fields.map(fieldHTML).join('') + '</div></div>' +
          '</section>';
        }).join('') +
      '</div>' +
      footerHTML(true);
  }

  function compactDrawer() {
    return headerHTML() +
      '<div class="dw-body"><div class="dform">' +
        GROUPS.map(function (g) {
          return '<section class="dsection">' +
            '<header class="dsection-head">' + groupIcon(g) +
              '<h3>' + esc(L(g.zh, g.en)) + '</h3>' +
              '<span class="fcount">' + countText(g.fields.length) + '</span>' +
            '</header>' +
            '<div class="dstack">' + g.fields.map(fieldHTML).join('') + '</div>' +
          '</section>';
        }).join('') +
      '</div></div>' +
      footerHTML(true);
  }

  function drawerHTML() {
    switch (state.variant) {
      case 'current': return currentDrawer();
      case 'B': return anchorDrawer();
      case 'C': return accordionDrawer();
      case 'D': return compactDrawer();
      default: return twoColumnDrawer();
    }
  }

  /* ---------------- app mock ---------------- */

  function tableHeadHTML() {
    return '<tr>' +
      '<th>' + L('主机名', 'Hostname') + '</th>' +
      '<th>' + L('状态', 'Status') + '</th>' +
      '<th>' + L('环境', 'Environment') + '</th>' +
      '<th>' + L('负责人', 'Owner') + '</th>' +
      '<th>' + L('更新时间', 'Updated') + '</th>' +
      '<th aria-label="' + L('操作', 'Actions') + '"></th>' +
    '</tr>';
  }

  function tableBodyHTML() {
    return ROWS.map(function (r) {
      return '<tr' + (r.selected ? ' data-selected' : '') + '>' +
        '<td class="name mono" style="font-size:11px">' + esc(r.name) + '</td>' +
        '<td><span class="status" data-tone="' + r.tone + '"><i></i>' + esc(statusText(r.st)) + '</span></td>' +
        '<td>' + esc(envText(r.env)) + '</td>' +
        '<td>' + esc(r.owner) + '</td>' +
        '<td class="mono" style="font-size:10px">' + esc(r.at) + '</td>' +
        '<td><div class="row-actions">' +
          '<button class="row-btn" type="button" aria-label="' + L('查看', 'View') + ' ' + esc(r.name) + '"><svg class="ic"><use href="#i-eye"/></svg></button>' +
          '<button class="row-btn" type="button" aria-label="' + L('编辑', 'Edit') + ' ' + esc(r.name) + '"><svg class="ic"><use href="#i-pencil"/></svg></button>' +
          '<button class="row-btn" type="button" aria-label="' + L('删除', 'Delete') + ' ' + esc(r.name) + '"><svg class="ic"><use href="#i-trash"/></svg></button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function renderStage() {
    stage.innerHTML =
      '<div class="app-mock" id="appMock" data-open="' + state.open + '">' +
        '<nav class="app-rail" aria-label="' + L('主导航', 'Main navigation') + '">' +
          '<button class="rail-btn" type="button" aria-current="true" aria-label="' + L('资源数据', 'Resources') + '"><svg class="ic"><use href="#i-server"/></svg></button>' +
          '<button class="rail-btn" type="button" aria-label="' + L('网络拓扑', 'Topology') + '"><svg class="ic"><use href="#i-network"/></svg></button>' +
          '<button class="rail-btn" type="button" aria-label="' + L('数据源', 'Data sources') + '"><svg class="ic"><use href="#i-database"/></svg></button>' +
          '<button class="rail-btn" type="button" aria-label="' + L('监控', 'Monitoring') + '"><svg class="ic"><use href="#i-activity"/></svg></button>' +
          '<button class="rail-btn" type="button" aria-label="' + L('设置', 'Settings') + '"><svg class="ic"><use href="#i-settings"/></svg></button>' +
        '</nav>' +
        '<div class="app-main">' +
          '<div class="page-head">' +
            '<div class="page-title"><h2>' + L('资源数据', 'Resources') + '</h2>' +
              '<p>' + L('主机 · 128 条实例', 'Host · 128 instances') + '</p></div>' +
            '<div class="page-tools">' +
              '<div class="search-box"><svg class="ic"><use href="#i-search"/></svg>' +
                '<input type="search" aria-label="' + L('搜索', 'Search') + '" placeholder="' + L('搜索主机名、IP 或标识', 'Search hostname, IP or ID') + '"></div>' +
              '<button class="btn primary" type="button" id="openDrawer">' +
                '<svg class="ic"><use href="#i-plus"/></svg>' + L('新建实例', 'New instance') + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="table-card"><div class="table-scroll"><table><thead>' + tableHeadHTML() + '</thead><tbody>' + tableBodyHTML() + '</tbody></table></div></div>' +
        '</div>' +
        '<div class="scrim" id="scrim"></div>' +
        '<aside class="drawer v-' + state.variant.toLowerCase() + '" role="dialog" aria-modal="true" aria-label="' + L('实例表单', 'Instance form') + '">' + drawerHTML() + '</aside>' +
        '<div class="closed-hint">' + L('抽屉已关闭 · 点击「新建实例」重新打开', 'Drawer closed · use “New instance” to reopen') + '</div>' +
      '</div>';

    var form = document.getElementById('bForm');
    if (form) wireRail(form);
  }

  function wireRail(form) {
    var drawer = form.closest('.drawer');
    var items = Array.prototype.slice.call(drawer.querySelectorAll('[data-goto]'));
    var sections = Array.prototype.slice.call(form.querySelectorAll('section[id^="sec-"]'));

    function activate(key) {
      items.forEach(function (it) {
        if (it.dataset.goto === key) it.setAttribute('aria-current', 'true');
        else it.removeAttribute('aria-current');
      });
    }

    form.addEventListener('scroll', function () {
      var top = form.getBoundingClientRect().top + 12;
      var current = sections[0];
      sections.forEach(function (s) {
        if (s.getBoundingClientRect().top <= top) current = s;
      });
      if (current) activate(current.id.replace('sec-', ''));
    }, { passive: true });

    items.forEach(function (it) {
      it.addEventListener('click', function () {
        var target = document.getElementById('sec-' + it.dataset.goto);
        if (!target) return;
        activate(it.dataset.goto);
        var top = form.scrollTop + target.getBoundingClientRect().top - form.getBoundingClientRect().top - 2;
        form.scrollTo({ top: top, behavior: prefersReduced() ? 'auto' : 'smooth' });
      });
    });
  }

  function prefersReduced() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  /* ---------------- brief + tabs ---------------- */

  function renderBrief() {
    var m = META[state.variant] || META.A;
    document.getElementById('vBadge').textContent = L(m.badgeZh, m.badgeEn);
    document.getElementById('vName').textContent = L(m.nameZh, m.nameEn);
    document.getElementById('vTagline').textContent = L(m.taglineZh, m.taglineEn);
    document.getElementById('fConcept').textContent = L(m.conceptZh, m.conceptEn);
    document.getElementById('fFit').textContent = L(m.fitZh, m.fitEn);
    document.getElementById('fTradeoff').textContent = L(m.tradeZh, m.tradeEn);
    document.getElementById('fEffort').textContent = L(m.effortZh, m.effortEn);
    var reco = state.lang === 'en'
      ? 'Recommendation: start with A for regular models; use B only when a model passes roughly 25 attributes.'
      : '建议：常规模型先用 A；属性超过 25 个再考虑 B。';
    document.getElementById('reco').innerHTML = '<strong>' + (state.lang === 'en' ? 'Where it lands: ' : '落地位置：') + '</strong>' +
      (state.lang === 'en'
        ? 'InstanceDrawer in web/src/cmdb/pages/Instances.tsx. B also needs an xl size in Drawer.tsx. '
        : 'web/src/cmdb/pages/Instances.tsx 的 InstanceDrawer；B 还需在 Drawer.tsx 增加 xl 档位。') +
      '<br>' + esc(reco);
  }

  function syncTabs() {
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.setAttribute('aria-selected', String(tab.dataset.variant === state.variant));
      tab.tabIndex = tab.dataset.variant === state.variant ? 0 : -1;
    });
  }

  function applyStaticLang() {
    document.querySelectorAll('[data-zh]').forEach(function (el) {
      el.textContent = state.lang === 'en' ? el.dataset.en : el.dataset.zh;
    });
    document.documentElement.lang = state.lang === 'en' ? 'en' : 'zh-CN';
    document.getElementById('langLabel').textContent = state.lang === 'en' ? '中' : 'EN';
  }

  function renderAll() {
    applyStaticLang();
    renderBrief();
    renderStage();
    syncTabs();
    syncThemeButton();
  }

  /* ---------------- theme ---------------- */

  function effectiveTheme() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncThemeButton() {
    var current = effectiveTheme();
    var goingTo = current === 'dark' ? 'light' : 'dark';
    document.getElementById('themeIcon').innerHTML = '<use href="#i-' + (goingTo === 'dark' ? 'moon' : 'sun') + '"/>';
    document.getElementById('themeLabel').textContent = goingTo === 'dark' ? L('深色', 'Dark') : L('浅色', 'Light');
    document.getElementById('themeBtn').setAttribute('aria-label', goingTo === 'dark' ? L('切换到深色', 'Switch to dark') : L('切换到浅色', 'Switch to light'));
  }

  /* ---------------- events ---------------- */

  stage.addEventListener('click', function (event) {
    var target = event.target;
    if (target.closest('#openDrawer')) {
      state.open = true;
      document.getElementById('appMock').setAttribute('data-open', 'true');
      return;
    }
    if (target.closest('[data-close]') || target.id === 'scrim') {
      state.open = false;
      document.getElementById('appMock').setAttribute('data-open', 'false');
      return;
    }
    var accHead = target.closest('[data-acc]');
    if (accHead) {
      var acc = accHead.closest('.acc');
      var open = acc.getAttribute('data-open') === 'true';
      acc.setAttribute('data-open', String(!open));
      accHead.setAttribute('aria-expanded', String(!open));
    }
  });

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      state.variant = tab.dataset.variant;
      state.open = true;
      renderAll();
    });
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    syncThemeButton();
  });

  document.getElementById('langBtn').addEventListener('click', function () {
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    renderAll();
    syncThemeButton();
  });

  renderAll();
  syncThemeButton();
})();
</script>
